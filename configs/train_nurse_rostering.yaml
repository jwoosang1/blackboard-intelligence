job_name: nurse_rostering
output_dir: checkpoints
seed: 2026

# Training data configuration
num_epochs: 12
batch_size_device: 1
grad_accum_steps: 16
lr: 1.0e-4
min_lr_ratio: 0.1
warmup_steps: 100
max_length: 1152              # paper: train max ~982, held-out eval max 1060; 1152 fits all with margin
max_grad_norm: 1.0
gradient_checkpointing: false

# Head OFF (SFT-only)
masking_only: true

# Data
train_puzzles: data/nurse_rostering/nurse_rostering_train.json
eval_puzzles: data/nurse_rostering/nurse_rostering_eval.json
color_permute_augment: false
doom_negative_frac: 0.0
t_min: 0.05
t_max: 0.95

# Model
model_name: GSAI-ML/LLaDA-8B-Instruct
torch_dtype: bf16
trust_remote_code: true
mask_token_id: 126336

# LoRA
use_lora: true
lora_r: 256
lora_alpha: 256
lora_dropout: 0.05
lora_target_modules: q_proj,k_proj,v_proj,o_proj

# Logging / checkpointing
logging_steps: 10
max_keep_ckpts: 20
eval_steps: 500

# wandb
use_wandb: true
wandb_project: blackboard-intelligence
wandb_entity: your-wandb-entity
wandb_run_name: nurse_rostering

# Resume / distributed
resume: null
ddp: true
